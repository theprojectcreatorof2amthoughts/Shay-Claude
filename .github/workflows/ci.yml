name: Shay-Claude CI

on:
  push:
    branches: [main, "feat/**", "bot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shay-Claude
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n install.sh
          sh -n update.sh
      - name: Validate pinned upstream revision
        run: |
          commit="$(sed -n 's/^SHAY_COMMIT=//p' toolchain.lock)"
          test "${#commit}" -eq 40
          case "$commit" in
            *[!0-9a-f]*) echo "Invalid SHAY_COMMIT" >&2; exit 1 ;;
          esac
      - name: Build, test, and install pinned Shay
        run: |
          ./install.sh
          "$HOME/.local/bin/gshai" --version
          "$HOME/.local/bin/shaii" --version
